services:
  - type: web
    name: teranga-ai
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PRIMARY
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://teranga-assistant.onrender.com
      # Voix locale : URL du micro-service TTS (ci-dessous). Vide -> Web Speech.
      - key: MMS_TTS_URL
        value: https://teranga-tts.onrender.com/
      # Secret partage avec le service TTS (genere par teranga-tts, repris ici).
      - key: TTS_AUTH_TOKEN
        fromService:
          type: web
          name: teranga-tts
          envVarKey: TTS_AUTH_TOKEN

  # Micro-service de synthese vocale locale (Meta MMS-TTS, Python).
  # ATTENTION : prevoir >= 1 Go de RAM (plan standard). Le free tier 512 Mo ne
  # suffit pas pour PyTorch + modele. Voir tts-service/README.md.
  - type: web
    name: teranga-tts
    runtime: python
    rootDir: tts-service
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TTS_MAX_MODELS
        value: "2"
      - key: TTS_AUTH_TOKEN
        generateValue: true

  - type: web
    name: teranga-assistant
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://teranga-ai.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
