services:
  - type: web
    name: teranga-ai
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PRIMARY
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://teranga-assistant.onrender.com
      # Voix locale : URL du service TTS deploye GRATUITEMENT sur HF Spaces
      # (voir tts-service/README.md). Vide -> le frontend lit via Web Speech.
      # ex: https://<user>-teranga-tts.hf.space/
      - key: MMS_TTS_URL
        sync: false
      # Meme secret que le Space HF (facultatif mais recommande).
      - key: TTS_AUTH_TOKEN
        sync: false

  - type: web
    name: teranga-assistant
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://teranga-ai.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
